name: Build and Deploy LC App

on:
  push:
    branches:
      - finno-vps
      - local-server
      # - esage-vps   # <-- UNCOMMENT when the Esage server is restored

jobs:
  # =========================================================
  # JOB 1: Build and Push Docker Image (Local Server)
  # Image: finnovator/lc-local  (create as PRIVATE on Docker Hub)
  # =========================================================
  build-and-push-local:
    if: github.ref == 'refs/heads/local-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: finnovator/lc-local:latest
          build-args: |
            BS_API_KEY=${{ secrets.BS_LOCAL_API_URL }}
            LO_API_KEY=${{ secrets.LO_LOCAL_API_URL }}
            LM_API_KEY=${{ secrets.LM_LOCAL_API_URL }}
            HOST_API_KEY=${{ secrets.HOST_LOCAL_API_URL }}
            DMS_API_KEY=${{ secrets.DMS_LOCAL_API_URL }}
            AML_API_KEY=${{ secrets.AML_LOCAL_API_URL }}
            SECRET_KEY=${{ secrets.LC_SECRET_KEY }}

  # =========================================================
  # JOB 2: Deploy to Finno VPS (build on GitHub, PM2 on server)
  # Same pattern as LM — no git, no bash on the Windows server.
  # LC's next.config.ts fallbacks are the Finno URLs, so the
  # build works even before the FINNO secrets exist.
  # =========================================================
  deploy-finno-vps:
    if: github.ref == 'refs/heads/finno-vps'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build the app
        run: |
          npm ci
          npm run build
        env:
          BS_API_KEY: ${{ secrets.BS_FINNO_API_URL }}
          LO_API_KEY: ${{ secrets.LO_FINNO_API_URL }}
          LM_API_KEY: ${{ secrets.LM_FINNO_API_URL }}
          HOST_API_KEY: ${{ secrets.HOST_FINNO_API_URL }}
          DMS_API_KEY: ${{ secrets.DMS_FINNO_API_URL }}
          AML_API_KEY: ${{ secrets.AML_FINNO_API_URL }}
          SECRET_KEY: ${{ secrets.LC_SECRET_KEY }}


      - name: Stop PM2 on Finno VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FINNO_VPS_IP }}
          username: ${{ secrets.FINNO_VPS_USER }}
          password: ${{ secrets.FINNO_VPS_PASSWORD }}
          script: |
            pm2 delete LC-FINNO || echo "App not found, continuing..."

      - name: Copy built app to Finno VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FINNO_VPS_IP }}
          username: ${{ secrets.FINNO_VPS_USER }}
          password: ${{ secrets.FINNO_VPS_PASSWORD }}
          source: ".next/standalone,.next/static,public,package.json"
          target: "C:/LC-AUTO"

      - name: Start PM2 on Finno VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FINNO_VPS_IP }}
          username: ${{ secrets.FINNO_VPS_USER }}
          password: ${{ secrets.FINNO_VPS_PASSWORD }}
          script: |
            cmd /c "set PORT=3003 && pm2 start C:\LC-AUTO\.next\standalone\server.js --name LC-FINNO"
            cmd /c "pm2 save"

  # =========================================================
  # JOB 3: Esage VPS — commented out until server is restored.
  # =========================================================
